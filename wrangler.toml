name = "theairuntime"
main = "src/worker.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Run the Worker before static-asset serving so the host-routing redirects in
# src/worker.ts actually fire. Without this, Cloudflare serves a matching file
# (e.g. dist/index.html for "/") before the Worker runs, so the lab-host root
# redirect never executes. The Worker falls through to env.ASSETS.fetch() for
# everything it does not redirect, so normal asset serving is unchanged.
run_worker_first = true

# Cloudflare Workers AI. Native to the platform: no API key, no account with a
# model provider, nothing to paste. Uncommenting the two lines is the whole
# setup. One [ai] table serves every feature that uses it.
#
# Two features share it:
#   "Ask the Library" (/api/ask), which returns the matched reads either way and
#     adds a generated answer once this is on.
#   FDE Gym (/api/fde-gym/*), which runs a deterministic degraded interview
#     without it and real interviewer and evaluator output with it.
#
# [ai]
# binding = "AI"

# Student cohort waitlist storage. Until this is bound, /api/waitlist returns
# 503 and the cohort form falls back to PUBLIC_COHORT_JOIN_URL. To enable:
#   npx wrangler kv namespace create WAITLIST
# then paste the returned id below and uncomment.
# [[kv_namespaces]]
# binding = "WAITLIST"
# id = "<your-kv-namespace-id>"

# Field Lab intake review queue. Until this is bound, /api/intake returns 503
# and the intake page falls back to the per-branch PUBLIC_*_INTAKE_URL env
# vars. The problem branch writes a Field Brief draft (status Draft); build and
# partner branches write interest records. Nothing here is ever auto-published.
#   npx wrangler kv namespace create INTAKE
# then paste the returned id below and uncomment.
# [[kv_namespaces]]
# binding = "INTAKE"
# id = "<your-kv-namespace-id>"

# FDE Gym interview retention. This is the one binding FDE Gym cannot run
# without: no KV, no interviews, and /fde-gym/ tells the visitor it is not open
# yet. Cohort 0 sessions are stored here only after explicit consent, with a TTL
# (FDE_GYM_SESSION_TTL_SECONDS, 30 days by default). To enable:
#   npx wrangler kv namespace create FDE_GYM_SESSIONS
# then paste the returned id below and uncomment.
# [[kv_namespaces]]
# binding = "FDE_GYM_SESSIONS"
# id = "<your-kv-namespace-id>"

# Optional FDE Gym settings. Every one of these has a working default, so skip
# the whole block unless you want to change something. These are Workers AI
# model names, not credentials.
# [vars]
# FDE_GYM_INTERVIEW_MODEL = "@cf/meta/llama-3.1-8b-instruct"
# FDE_GYM_EVALUATOR_MODEL = "@cf/meta/llama-3.1-8b-instruct"
# FDE_GYM_SESSION_TTL_SECONDS = "2592000"

# The personalized report email is the only part that needs an outside service.
# Without it the interview and the on-screen result work in full; only the
# emailed report is unavailable, and the app says so rather than pretending it
# sent one. To enable: npx wrangler secret put RESEND_API_KEY, then add
# FDE_GYM_FROM_EMAIL (a verified sender) to the [vars] block above.
