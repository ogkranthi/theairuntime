# This file is the source of truth for the Worker.
#
# The Worker deploys through Cloudflare Workers Builds on every merge to main,
# and a deploy from a Wrangler config overwrites bindings and plain text vars
# that were set in the Cloudflare dashboard. Add bindings and [vars] here, not
# in the dashboard, or the next merge will silently remove them.
#
# Secrets are the exception. Wrangler never deletes them, so set those with
# `npx wrangler secret put NAME` or in the dashboard, and never in this file.

name = "theairuntime"
main = "src/worker.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Run the Worker before static-asset serving so the host-routing redirects in
# src/worker.ts actually fire. Without this, Cloudflare serves a matching file
# (e.g. dist/index.html for "/") before the Worker runs, so the lab-host root
# redirect never executes. The Worker falls through to env.ASSETS.fetch() for
# everything it does not redirect, so normal asset serving is unchanged.
run_worker_first = true

# Cloudflare Workers AI. Native to the platform: no API key, no account with a
# model provider, nothing to paste. One [ai] table serves the whole Worker, so
# turning it on turns it on for every feature that uses it:
#
#   FDE Gym (/api/fde-gym/*) gets real interviewer and evaluator output instead
#     of the deterministic degraded interview.
#   "Ask the Library" (/api/ask) adds a generated answer on top of the matched
#     reads it returns either way.
#
[ai]
binding = "AI"

# Student cohort waitlist storage. Until this is bound, /api/waitlist returns
# 503 and the cohort form falls back to PUBLIC_COHORT_JOIN_URL. To enable:
#   npx wrangler kv namespace create WAITLIST
# then paste the returned id below and uncomment.
# [[kv_namespaces]]
# binding = "WAITLIST"
# id = "<your-kv-namespace-id>"

# Field Lab intake review queue. Until this is bound, /api/intake returns 503
# and the intake page falls back to the per-branch PUBLIC_*_INTAKE_URL env
# vars. The problem branch writes a Field Brief draft (status Draft); build and
# partner branches write interest records. Nothing here is ever auto-published.
#   npx wrangler kv namespace create INTAKE
# then paste the returned id below and uncomment.
# [[kv_namespaces]]
# binding = "INTAKE"
# id = "<your-kv-namespace-id>"

# FDE Gym interview retention. Cohort 0 sessions land here only after explicit
# consent, and expire on the FDE_GYM_SESSION_TTL_SECONDS window documented
# below. Without this binding there are no interviews: /fde-gym/ loads,
# explains itself, and tells the visitor it is not open yet.
#
# The namespace id is public and account-scoped, which is why it lives in the
# repository rather than in a secret.
[[kv_namespaces]]
binding = "FDE_GYM_SESSIONS"
id = "8cb02842b8d44f07886395524b17128a"

# FDE Gym model selection. These are Workers AI model names, not credentials
# and not an external API. src/fde-gym/model.ts already carries exactly these
# values as its defaults, so nothing needs to be set for them to take effect:
#
#   interviewer  @cf/meta/llama-3.3-70b-instruct-fp8-fast
#     runs on every candidate message, so it is picked for latency
#   evaluator    @cf/meta/llama-3.3-70b-instruct-fp8-fast
#     runs once and must return strict JSON. The models with native
#     structured output are gated behind a paid Workers plan, so the
#     evaluator earns its JSON through the prompt instead.
#   session TTL  30 days
#
# This account is on the Workers Free plan, and the Workers AI catalogue is
# gated by plan. @cf/zai-org/glm-5.3 was the evaluator until production
# answered "5035: Model @cf/zai-org/glm-5.3 is not available on the Workers
# Free plan" on every finish. Check plan availability, not just that a model
# id exists, before changing either value.
#
# Deliberately left commented. This Worker has no [vars] table today, and its
# environment variables (SUBSTACK_ORIGIN, LEAD_WEBHOOK_URL, the AIRTABLE_* and
# PUBLIC_* set) live in the dashboard. Introducing a [vars] table here makes
# this file authoritative for plain text vars, and the documented behavior is
# that a deploy then overrides what the dashboard holds. Adding one to name
# three values that are already the defaults is not worth the chance of
# clearing the rest.
#
# If you do want them pinned in review, move every dashboard var into this
# block in the same commit, or add keep_vars = true above and confirm the
# merge behavior on a preview deploy first.
#
# A retired model id does not fail loudly: the call throws, the session drops
# to the deterministic path, and health still reports aiConfigured true. Check
# both ids against developers.cloudflare.com/workers-ai/models before a cohort
# runs, and change them in src/fde-gym/model.ts.
#
# [vars]
# FDE_GYM_INTERVIEW_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# FDE_GYM_EVALUATOR_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# FDE_GYM_SESSION_TTL_SECONDS = "2592000"

# The personalized report email is the only part that needs an outside service.
# Without it the interview and the on-screen result work in full; only the
# emailed report is unavailable, and the app says so rather than pretending it
# sent one. To enable: npx wrangler secret put RESEND_API_KEY, then set
# FDE_GYM_FROM_EMAIL (a verified sender) as a dashboard variable, alongside the
# other environment variables this Worker already keeps there.
